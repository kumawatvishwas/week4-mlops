name: CI with Pytest and CML

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest Unit Tests
        run: |
          pytest > result.txt || true

      - name: Run Training Pipeline
        run: |
          python src/train.py

      - name: Post CML Report as Comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Report Summary" > report.md
          echo "###  Pytest Results:" >> report.md
          cat result.txt >> report.md
          echo "### Model Metrics:" >> report.md
          cat metrics.json >> report.md
          npx cml comment create report.md

